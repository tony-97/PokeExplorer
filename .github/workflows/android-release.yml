name: Android Release (Testing)

on:
  push:
    tags:
      # Triggers on tags like v1.0.0
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-cache: 'npm'
          node-version: 20

      # 3. Install npm dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Set up Java environment for Android compilation
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 5. Make Gradle executable
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # 6. Compile the Release APK (uses the default debug key automatically)
      - name: Build Android Release
        run: |
          cd android
          ./gradlew assembleRelease

      # 7. Create a GitHub Release and upload the working APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
